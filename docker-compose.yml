services:

  file-storage-api:
    build:
      context: .
      dockerfile: MinIO/Dockerfile

    container_name: file-storage-api

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      Minio__Endpoint: minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin123
      Minio__BucketName: employee-documents
      Minio__UseSSL: "false"

    depends_on:
      minio:
        condition: service_healthy

    networks:
      - file-storage-network

  file-management-web:
    build:
      context: .
      dockerfile: FileManagement.Web/Dockerfile

    container_name: file-management-web

    ports:
      - "5100:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      FileStorageApi__BaseUrl: http://file-storage-api:8080

    depends_on:
      - file-storage-api

    networks:
      - file-storage-network

  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"

    volumes:
      - minio-data:/bitnami/minio/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - file-storage-network

networks:
  file-storage-network:
    driver: bridge

volumes:
  minio-data: